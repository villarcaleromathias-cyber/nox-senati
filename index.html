<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nox - Agenda SENATI</title>
  
  <!-- Tailwind & Fuentes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Scrollbar personalizado para el chat y la página */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body class="bg-black text-white antialiased selection:bg-purple-500 selection:text-white min-h-screen pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ESTADO INICIAL POR DEFECTO ---
    const initialState = {
      courses: [
        { id: '1', name: 'Estructura de Datos en C++', color: '#8B5CF6' }, // Morado acorde al diseño
        { id: '2', name: 'Algoritmia', color: '#10B981' }
      ],
      classes: [],
      exams: [],
      tasks: [],
      materials: []
    };

    function App() {
      // --- ESTADOS ---
      const [appState, setAppState] = useState(() => {
        const saved = localStorage.getItem('nox_senati_data');
        return saved ? JSON.parse(saved) : initialState;
      });
      const [monthFilter, setMonthFilter] = useState('ALL');
      const [modal, setModal] = useState({ isOpen: false, title: '', fields: [], type: '', editId: null });

      // Guardar en localStorage cada vez que appState cambia
      useEffect(() => {
        localStorage.setItem('nox_senati_data', JSON.stringify(appState));
      }, [appState]);

      // Renderizar iconos de Lucide
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // --- FUNCIONES DE FILTRO Y BÚSQUEDA ---
      const filterByMonth = (dateString) => {
        if (monthFilter === 'ALL' || !dateString) return true;
        return new Date(dateString).getMonth() === parseInt(monthFilter);
      };

      const getCourse = (id) => appState.courses.find(c => c.id === id) || { name: 'General', color: '#4B5563' };

      // --- FUNCIONES DE ELIMINAR ---
      const deleteItem = (collection, id) => {
        setAppState(prev => ({ ...prev, [collection]: prev[collection].filter(i => i.id !== id) }));
      };

      // --- MANEJO DEL MODAL ---
      const openModal = (title, fields, type, editId = null) => {
        setModal({ isOpen: true, title, fields, type, editId });
      };

      const closeModal = () => setModal({ ...modal, isOpen: false });

      const handleModalSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.id = modal.editId || Date.now().toString();

        setAppState(prev => {
          const newState = { ...prev };
          if (modal.type === 'task' && modal.editId) {
            const idx = newState.tasks.findIndex(t => t.id === modal.editId);
            if (idx !== -1) newState.tasks[idx] = data;
          } else {
            newState[modal.type + (modal.type === 'class' ? 'es' : 's')]?.push(data) || newState[modal.type]?.push(data);
            // Parche rápido para plurales: course->courses, class->classes, exam->exams, task->tasks, material->materials
            if(modal.type === 'course') newState.courses = [...prev.courses, data];
            if(modal.type === 'class') newState.classes = [...prev.classes, data];
            if(modal.type === 'exam') newState.exams = [...prev.exams, data];
            if(modal.type === 'task' && !modal.editId) newState.tasks = [...prev.tasks, data];
            if(modal.type === 'material') newState.materials = [...prev.materials, data];
          }
          return newState;
        });
        closeModal();
      };

      // --- CONFIGURACIÓN DE MODALES ---
      const modalsConfig = {
        course: () => openModal('Añadir Curso', [
          { label: 'Nombre del Curso (ej. C++ Avanzado)', name: 'name', type: 'text' },
          { label: 'Color', name: 'color', type: 'color', value: '#8B5CF6' }
        ], 'course'),
        class: () => openModal('Añadir Clase o Horario', [
          { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
          { label: 'Título / Tema', name: 'title', type: 'text' },
          { label: 'Fecha', name: 'date', type: 'date' },
          { label: 'Hora', name: 'time', type: 'time' }
        ], 'class'),
        exam: () => openModal('Añadir Examen', [
          { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
          { label: 'Título', name: 'title', type: 'text' },
          { label: 'Tipo', name: 'type', type: 'select', options: [{id:'Parcial', name:'Parcial'}, {id:'Final', name:'Final'}, {id:'Práctica C++', name:'Práctica C++'}] },
          { label: 'Fecha', name: 'date', type: 'date' },
          { label: 'Hora', name: 'time', type: 'time' }
        ], 'exam'),
        task: (editId = null) => {
          const task = editId ? appState.tasks.find(t => t.id === editId) : {};
          openModal(editId ? 'Editar Entregable' : 'Añadir Entregable', [
            { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses, value: task.courseId },
            { label: 'Título del Trabajo', name: 'title', type: 'text', value: task.title },
            { label: 'Descripción / Requisitos C++', name: 'description', type: 'textarea', value: task.description },
            { label: 'Fecha Límite', name: 'dueDate', type: 'date', value: task.dueDate }
          ], 'task', editId);
        },
        material: () => openModal('Añadir Material / Código C++', [
          { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
          { label: 'Título del Archivo / Script (.cpp)', name: 'title', type: 'text' },
          { label: 'Ruta o Enlace (GitHub / Local)', name: 'url', type: 'text' }
        ], 'material')
      };

      return (
        <div className="max-w-6xl mx-auto">
          {/* Header */}
          <header className="border-b border-gray-800 bg-black/50 backdrop-blur-md sticky top-0 z-40 px-6 py-4">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <i data-lucide="moon" className="w-6 h-6 text-purple-500"></i>
                <h1 className="font-bold text-xl tracking-tight">Nox<span className="text-gray-500 font-normal"> / SENATI</span></h1>
              </div>
              <div className="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-sm">
                <i data-lucide="calendar" className="w-4 h-4 text-purple-400"></i>
                <select value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)} className="bg-transparent text-white focus:outline-none cursor-pointer">
                  <option value="ALL" className="bg-gray-900">Todos los Meses</option>
                  <option value="0" className="bg-gray-900">Enero</option>
                  <option value="1" className="bg-gray-900">Febrero</option>
                  <option value="2" className="bg-gray-900">Marzo</option>
                  <option value="3" className="bg-gray-900">Abril</option>
                  <option value="4" className="bg-gray-900">Mayo</option>
                  <option value="5" className="bg-gray-900">Junio</option>
                  <option value="6" className="bg-gray-900">Julio</option>
                  <option value="7" className="bg-gray-900">Agosto</option>
                  <option value="8" className="bg-gray-900">Setiembre</option>
                  <option value="9" className="bg-gray-900">Octubre</option>
                  <option value="10" className="bg-gray-900">Noviembre</option>
                  <option value="11" className="bg-gray-900">Diciembre</option>
                </select>
              </div>
            </div>
          </header>

          {/* Contenido Principal */}
          <main className="px-6 mt-8 grid grid-cols-1 md:grid-cols-4 gap-8">
            
            {/* Columna Izquierda (Sidebar) */}
            <div className="space-y-6 md:col-span-1">
              {/* Componente Cursos */}
              <div className="bg-[#111] p-5 rounded-xl border border-gray-800">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-bold flex items-center gap-2 text-sm text-gray-200">
                    <i data-lucide="book-open" className="w-4 h-4 text-purple-500"></i> Cursos
                  </h2>
                  <button onClick={modalsConfig.course} className="text-purple-400 hover:text-purple-300">
                    <i data-lucide="plus-circle" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="space-y-2">
                  {appState.courses.length === 0 && <p className="text-xs text-gray-500">Sin cursos.</p>}
                  {appState.courses.map(c => (
                    <div key={c.id} className="flex items-center justify-between p-2.5 rounded-lg bg-gray-900 border border-gray-800">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: c.color }}></span>
                        <span className="font-medium text-xs text-gray-300">{c.name}</span>
                      </div>
                      <button onClick={() => deleteItem('courses', c.id)} className="text-gray-500 hover:text-red-500">
                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Componente Aurora IA */}
              <AuroraIA />
            </div>

            {/* Columna Derecha (Listas) */}
            <div className="md:col-span-3 space-y-8">
              {/* Botones Rápidos */}
              <div className="flex flex-wrap gap-3">
                <button onClick={modalsConfig.class} className="bg-gray-900 border border-gray-800 text-gray-300 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-800 hover:border-gray-700 transition-colors flex items-center gap-2">
                  <i data-lucide="clock" className="w-4 h-4 text-purple-400"></i> + Clase
                </button>
                <button onClick={modalsConfig.exam} className="bg-gray-900 border border-gray-800 text-gray-300 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-800 hover:border-gray-700 transition-colors flex items-center gap-2">
                  <i data-lucide="file-text" className="w-4 h-4 text-emerald-400"></i> + Examen
                </button>
                <button onClick={() => modalsConfig.task()} className="bg-gray-900 border border-gray-800 text-gray-300 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-800 hover:border-gray-700 transition-colors flex items-center gap-2">
                  <i data-lucide="check-square" className="w-4 h-4 text-blue-400"></i> + Entregable
                </button>
                <button onClick={modalsConfig.material} className="bg-gray-900 border border-gray-800 text-gray-300 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-800 hover:border-gray-700 transition-colors flex items-center gap-2">
                  <i data-lucide="code" className="w-4 h-4 text-orange-400"></i> + Código C++
                </button>
              </div>

              {/* Secciones */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                {/* Clases */}
                <div className="bg-[#111] p-5 rounded-xl border border-gray-800">
                  <h2 className="font-bold mb-4 text-sm flex items-center gap-2 text-gray-200">
                    <i data-lucide="calendar-days" className="w-4 h-4 text-purple-500"></i> Clases y Horarios
                  </h2>
                  <div className="space-y-3">
                    {appState.classes.filter(i => filterByMonth(i.date)).map(i => {
                      const c = getCourse(i.courseId);
                      return (
                        <div key={i.id} className="p-3 rounded-lg border-l-4 bg-gray-900" style={{ borderLeftColor: c.color }}>
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-[10px] uppercase font-bold text-gray-500">{c.name}</span>
                              <h4 className="font-bold text-sm text-gray-200">{i.title}</h4>
                            </div>
                            <button onClick={() => deleteItem('classes', i.id)} className="text-gray-600 hover:text-red-500"><i data-lucide="x" className="w-4 h-4"></i></button>
                          </div>
                          <p className="text-xs text-gray-400 mt-1">{i.date} - {i.time}</p>
                        </div>
                      );
                    })}
                    {appState.classes.filter(i => filterByMonth(i.date)).length === 0 && <p className="text-xs text-gray-600">No hay clases este mes.</p>}
                  </div>
                </div>

                {/* Exámenes */}
                <div className="bg-[#111] p-5 rounded-xl border border-gray-800">
                  <h2 className="font-bold mb-4 text-sm flex items-center gap-2 text-gray-200">
                    <i data-lucide="award" className="w-4 h-4 text-emerald-500"></i> Exámenes
                  </h2>
                  <div className="space-y-3">
                    {appState.exams.filter(i => filterByMonth(i.date)).map(i => {
                      const c = getCourse(i.courseId);
                      return (
                        <div key={i.id} className="flex items-center justify-between p-3 rounded-lg bg-gray-900 border border-gray-800">
                          <div>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">{i.type}</span>
                            <h4 className="font-bold text-sm text-gray-200 mt-2">{i.title}</h4>
                            <p className="text-xs text-gray-500">{c.name} • {i.date} | {i.time}</p>
                          </div>
                          <button onClick={() => deleteItem('exams', i.id)} className="text-gray-600 hover:text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                        </div>
                      );
                    })}
                    {appState.exams.filter(i => filterByMonth(i.date)).length === 0 && <p className="text-xs text-gray-600">No hay exámenes este mes.</p>}
                  </div>
                </div>

                {/* Entregables */}
                <div className="bg-[#111] p-5 rounded-xl border border-gray-800 lg:col-span-2">
                  <h2 className="font-bold mb-4 text-sm flex items-center gap-2 text-gray-200">
                    <i data-lucide="check-circle-2" className="w-4 h-4 text-blue-500"></i> Entregables y Trabajos
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {appState.tasks.filter(i => filterByMonth(i.dueDate)).map(i => {
                      const c = getCourse(i.courseId);
                      return (
                        <div key={i.id} className="p-4 rounded-xl bg-gray-900 border border-gray-800 flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between items-start mb-2">
                              <span className="text-[10px] font-bold text-white px-2 py-0.5 rounded" style={{ backgroundColor: c.color }}>{c.name}</span>
                              <div className="flex gap-2">
                                <button onClick={() => modalsConfig.task(i.id)} className="text-gray-500 hover:text-purple-400"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                                <button onClick={() => deleteItem('tasks', i.id)} className="text-gray-500 hover:text-red-500"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                              </div>
                            </div>
                            <h4 className="font-bold text-sm text-gray-200">{i.title}</h4>
                            <p className="text-xs text-gray-400 mt-1 mb-3 line-clamp-2">{i.description}</p>
                          </div>
                          <p className="text-xs font-semibold text-gray-500 flex items-center gap-1">
                            <i data-lucide="clock" className="w-3 h-3"></i> Límite: {i.dueDate}
                          </p>
                        </div>
                      );
                    })}
                    {appState.tasks.filter(i => filterByMonth(i.dueDate)).length === 0 && <p className="text-xs text-gray-600">No hay entregables pendientes.</p>}
                  </div>
                </div>

                {/* Materiales C++ */}
                <div className="bg-[#111] p-5 rounded-xl border border-gray-800 lg:col-span-2">
                  <h2 className="font-bold mb-4 text-sm flex items-center gap-2 text-gray-200">
                    <i data-lucide="file-code" className="w-4 h-4 text-orange-500"></i> Repositorio de Código C++
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {appState.materials.map(i => {
                      const c = getCourse(i.courseId);
                      return (
                        <div key={i.id} className="p-3 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-between">
                          <div className="overflow-hidden">
                            <span className="text-[10px] font-bold text-gray-400">{c.name}</span>
                            <h5 className="text-sm font-bold text-gray-200 mt-0.5 truncate flex items-center gap-1.5">
                              <i data-lucide="file-code" className="w-3.5 h-3.5 text-orange-500"></i> {i.title}
                            </h5>
                            <a href={i.url} target="_blank" className="text-xs text-purple-400 hover:text-purple-300 underline truncate block mt-1">{i.url}</a>
                          </div>
                          <button onClick={() => deleteItem('materials', i.id)} className="text-gray-600 hover:text-red-500 ml-2"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                        </div>
                      );
                    })}
                    {appState.materials.length === 0 && <p className="text-xs text-gray-600">Sin materiales añadidos.</p>}
                  </div>
                </div>

              </div>
            </div>
          </main>

          {/* Modal Genérico */}
          {modal.isOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-[#111] w-full max-w-md p-6 rounded-2xl border border-gray-800 shadow-2xl">
                <h3 className="font-bold text-lg text-white mb-4 flex items-center gap-2">
                  <i data-lucide="plus" className="w-5 h-5 text-purple-500"></i> {modal.title}
                </h3>
                <form onSubmit={handleModalSubmit} className="space-y-4">
                  {modal.fields.map((f, index) => (
                    <div key={index}>
                      <label className="block text-xs font-semibold text-gray-400 mb-1.5">{f.label}</label>
                      {f.type === 'select' ? (
                        <select name={f.name} defaultValue={f.value} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                          {f.options.map(opt => <option key={opt.id} value={opt.id}>{opt.name}</option>)}
                        </select>
                      ) : f.type === 'textarea' ? (
                        <textarea name={f.name} defaultValue={f.value} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors h-20" required></textarea>
                      ) : (
                        <input type={f.type} name={f.name} defaultValue={f.value} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors" required />
                      )}
                    </div>
                  ))}
                  <div className="flex justify-end gap-3 pt-4 mt-6 border-t border-gray-800">
                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-gray-900 text-gray-400 hover:text-white text-sm rounded-xl font-semibold transition-colors border border-gray-800">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm rounded-xl font-semibold transition-colors shadow-lg shadow-purple-500/20">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- COMPONENTE AURORA IA (CHAT + VOZ) ---
    function AuroraIA() {
      const [messages, setMessages] = useState([
        { text: "¡Hola! Soy Aurora. Usa el micrófono o el chat para registrar tus clases o código C++.", sender: 'ai' }
      ]);
      const [input, setInput] = useState('');
      const [isListening, setIsListening] = useState(false);
      const chatRef = useRef(null);

      // Scroll al fondo cuando hay nuevo mensaje
      useEffect(() => {
        if(chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [messages]);

      // Configuración de Reconocimiento de Voz
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = SpeechRecognition ? new SpeechRecognition() : null;
      
      if (recognition) {
        recognition.lang = 'es-PE';
        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          setInput(transcript);
          setIsListening(false);
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
      }

      const toggleSpeech = () => {
        if (recognition) {
          if (isListening) { recognition.stop(); setIsListening(false); }
          else { recognition.start(); setIsListening(true); }
        } else {
          alert("Tu navegador no soporta entrada de voz.");
        }
      };

      const sendMessage = (e) => {
        e?.preventDefault();
        if(!input.trim()) return;
        setMessages([...messages, { text: input, sender: 'user' }]);
        setInput('');
        
        // Simular respuesta de Aurora (Aquí iría la integración real con IA)
        setTimeout(() => {
          setMessages(prev => [...prev, { text: "Entendido. Procesando tu solicitud de C++...", sender: 'ai' }]);
        }, 1000);
      };

      return (
        <div className="bg-[#111] p-5 rounded-xl border border-gray-800 flex flex-col h-80">
          <div className="flex justify-between items-center mb-4">
            <h2 className="font-bold flex items-center gap-2 text-sm text-gray-200">
              <i data-lucide="bot" className="w-4 h-4 text-purple-500"></i> IA Aurora
            </h2>
            <button onClick={toggleSpeech} className={`p-2 rounded-lg transition-colors ${isListening ? 'bg-red-500/20 text-red-500' : 'bg-gray-900 text-gray-400 hover:text-purple-400'}`} title="Hablar con Aurora">
              <i data-lucide="mic" className={`w-4 h-4 ${isListening ? 'animate-pulse' : ''}`}></i>
            </button>
          </div>
          
          {/* Caja de Chat */}
          <div ref={chatRef} className="flex-1 overflow-y-auto mb-4 space-y-3 pr-2">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`px-3 py-2 rounded-xl max-w-[85%] text-xs leading-relaxed ${m.sender === 'user' ? 'bg-purple-600 text-white rounded-br-sm' : 'bg-gray-900 text-gray-300 border border-gray-800 rounded-bl-sm'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          {/* Input */}
          <form onSubmit={sendMessage} className="flex gap-2">
            <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Comando para Aurora..." className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500 transition-colors" />
            <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center">
              <i data-lucide="send" className="w-3.5 h-3.5"></i>
            </button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
