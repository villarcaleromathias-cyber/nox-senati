<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Académico SENATI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --senati-blue: #002B49;
            --senati-accent: #005691;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #F4F6F9;
        }
    </style>
</head>
<body class="text-slate-800 pb-16">

    <!-- Header -->
    <header class="bg-[#002B49] text-white px-6 py-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i data-lucide="graduation-cap" class="w-6 h-6 text-blue-400"></i>
                <h1 class="font-bold text-lg">Portal SENATI - C++ & Gestión</h1>
            </div>
            <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg text-sm">
                <i data-lucide="calendar" class="w-4 h-4 text-blue-300"></i>
                <select id="globalMonthFilter" onchange="renderAll()" class="bg-transparent text-white focus:outline-none cursor-pointer">
                    <option value="ALL" class="text-slate-800">Todos los Meses</option>
                    <option value="0" class="text-slate-800">Enero</option>
                    <option value="1" class="text-slate-800">Febrero</option>
                    <option value="2" class="text-slate-800">Marzo</option>
                    <option value="3" class="text-slate-800">Abril</option>
                    <option value="4" class="text-slate-800">Mayo</option>
                    <option value="5" class="text-slate-800">Junio</option>
                    <option value="6" class="text-slate-800">Julio</option>
                    <option value="7" class="text-slate-800">Agosto</option>
                    <option value="8" class="text-slate-800">Setiembre</option>
                    <option value="9" class="text-slate-800">Octubre</option>
                    <option value="10" class="text-slate-800">Noviembre</option>
                    <option value="11" class="text-slate-800">Diciembre</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Contenido -->
    <main class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Columna Izquierda: Cursos y Aurora -->
        <div class="space-y-6">
            <!-- Cursos -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-[#002B49] flex items-center gap-2 text-sm">
                        <i data-lucide="book-open" class="w-4 h-4 text-[#005691]"></i> Cursos
                    </h2>
                    <button onclick="openCourseModal()" class="bg-[#005691] text-white px-2.5 py-1 rounded-lg text-xs font-semibold hover:bg-[#002B49] flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> Añadir
                    </button>
                </div>
                <div id="coursesList" class="space-y-2"></div>
            </div>

            <!-- Aurora AI / Micrófono -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-[#002B49] flex items-center gap-2 text-sm">
                        <i data-lucide="bot" class="w-4 h-4 text-[#005691]"></i> IA Aurora
                    </h2>
                    <button onclick="toggleSpeech()" class="p-2 bg-blue-50 text-[#005691] rounded-lg hover:bg-blue-100" title="Hablar con Aurora">
                        <i data-lucide="mic" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="chatBox" class="h-32 overflow-y-auto bg-slate-50 p-2.5 rounded-lg mb-2 text-xs space-y-2 border border-slate-100">
                    <div class="bg-white p-2 rounded shadow-xs text-slate-700">¡Hola! Usa los botones o pídele a Aurora gestionar tus clases y código en C++.</div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="Escribe comando..." class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-[#005691]">
                    <button onclick="sendChatMessage()" class="bg-[#002B49] text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Enviar</button>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Secciones Principales -->
        <div class="md:col-span-2 space-y-6">

            <!-- Botones de Acción -->
            <div class="flex flex-wrap gap-2">
                <button onclick="openClassModal()" class="bg-white border border-slate-200 text-[#002B49] px-3 py-2 rounded-lg text-xs font-semibold shadow-xs hover:bg-slate-50 flex items-center gap-1.5">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-[#005691]"></i> + Clase/Horario
                </button>
                <button onclick="openExamModal()" class="bg-white border border-slate-200 text-[#002B49] px-3 py-2 rounded-lg text-xs font-semibold shadow-xs hover:bg-slate-50 flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#005691]"></i> + Examen
                </button>
                <button onclick="openTaskModal()" class="bg-white border border-slate-200 text-[#002B49] px-3 py-2 rounded-lg text-xs font-semibold shadow-xs hover:bg-slate-50 flex items-center gap-1.5">
                    <i data-lucide="check-square" class="w-3.5 h-3.5 text-[#005691]"></i> + Entregable
                </button>
                <button onclick="openMaterialModal()" class="bg-white border border-slate-200 text-[#002B49] px-3 py-2 rounded-lg text-xs font-semibold shadow-xs hover:bg-slate-50 flex items-center gap-1.5">
                    <i data-lucide="code" class="w-3.5 h-3.5 text-[#005691]"></i> + Material / Código C++
                </button>
            </div>

            <!-- Clases -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-[#002B49] mb-3 text-sm flex items-center gap-2">
                    <i data-lucide="calendar-days" class="w-4 h-4 text-[#005691]"></i> Clases y Horarios
                </h2>
                <div id="classesList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
            </div>

            <!-- Exámenes -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-[#002B49] mb-3 text-sm flex items-center gap-2">
                    <i data-lucide="award" class="w-4 h-4 text-[#005691]"></i> Exámenes y Evaluaciones
                </h2>
                <div id="examsList" class="space-y-2"></div>
            </div>

            <!-- Entregables -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-[#002B49] mb-3 text-sm flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#005691]"></i> Entregables y Trabajos
                </h2>
                <div id="tasksList" class="space-y-2"></div>
            </div>

            <!-- Materiales / C++ -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-[#002B49] mb-3 text-sm flex items-center gap-2">
                    <i data-lucide="file-code" class="w-4 h-4 text-[#005691]"></i> Materiales y Proyectos en C++
                </h2>
                <div id="materialsList" class="space-y-2"></div>
            </div>

        </div>
    </main>

    <!-- Modal General -->
    <div id="modalContainer" class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md p-5 rounded-xl shadow-lg border border-slate-200">
            <h3 id="modalTitle" class="font-bold text-[#002B49] mb-3 text-base">Modal</h3>
            <form id="modalForm" onsubmit="handleModalSubmit(event)" class="space-y-3">
                <div id="modalFields" class="space-y-2.5"></div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 text-xs rounded-lg font-semibold">Cancelar</button>
                    <button type="submit" class="px-3 py-1.5 bg-[#005691] text-white text-xs rounded-lg font-semibold hover:bg-[#002B49]">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let appState = JSON.parse(localStorage.getItem('senati_app_data')) || {
            courses: [
                { id: '1', name: 'Estructura de Datos en C++', color: '#005691' },
                { id: '2', name: 'Algoritmia', color: '#10B981' }
            ],
            classes: [],
            exams: [],
            tasks: [],
            materials: []
        };

        let currentModalType = '';
        let currentEditId = null;

        function saveData() {
            localStorage.setItem('senati_app_data', JSON.stringify(appState));
            renderAll();
        }

        function filterByMonth(dateString) {
            const selectedMonth = document.getElementById('globalMonthFilter').value;
            if (selectedMonth === 'ALL' || !dateString) return true;
            return new Date(dateString).getMonth() === parseInt(selectedMonth);
        }

        function renderAll() {
            renderCourses();
            renderClasses();
            renderExams();
            renderTasks();
            renderMaterials();
            lucide.createIcons();
        }

        function getCourse(id) {
            return appState.courses.find(c => c.id === id) || { name: 'General', color: '#64748B' };
        }

        function renderCourses() {
            const container = document.getElementById('coursesList');
            container.innerHTML = appState.courses.length ? '' : '<p class="text-xs text-slate-400">Sin cursos.</p>';
            appState.courses.forEach(c => {
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-lg border border-slate-100 bg-slate-50">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${c.color}"></span>
                            <span class="font-medium text-xs text-slate-700">${c.name}</span>
                        </div>
                        <button onclick="deleteCourse('${c.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
            });
        }

        function renderClasses() {
            const container = document.getElementById('classesList');
            const items = appState.classes.filter(i => filterByMonth(i.date));
            container.innerHTML = items.length ? '' : '<p class="text-xs text-slate-400 col-span-2">Sin clases programadas.</p>';
            items.forEach(i => {
                const c = getCourse(i.courseId);
                container.innerHTML += `
                    <div class="p-3 rounded-lg border-l-4 bg-slate-50" style="border-left-color: ${c.color}">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] uppercase font-bold text-slate-400">${c.name}</span>
                                <h4 class="font-bold text-xs text-slate-800">${i.title}</h4>
                            </div>
                            <button onclick="deleteItem('classes', '${i.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-1">${i.date} - ${i.time}</p>
                    </div>
                `;
            });
        }

        function renderExams() {
            const container = document.getElementById('examsList');
            const items = appState.exams.filter(i => filterByMonth(i.date));
            container.innerHTML = items.length ? '' : '<p class="text-xs text-slate-400">Sin exámenes.</p>';
            items.forEach(i => {
                const c = getCourse(i.courseId);
                container.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 border border-slate-100">
                        <div>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">${i.type}</span>
                            <h4 class="font-bold text-xs text-slate-800 mt-1">${i.title} (${c.name})</h4>
                            <p class="text-[11px] text-slate-500">${i.date} | ${i.time}</p>
                        </div>
                        <button onclick="deleteItem('exams', '${i.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
            });
        }

        function renderTasks() {
            const container = document.getElementById('tasksList');
            const items = appState.tasks.filter(i => filterByMonth(i.dueDate));
            container.innerHTML = items.length ? '' : '<p class="text-xs text-slate-400">Sin entregables.</p>';
            items.forEach(i => {
                const c = getCourse(i.courseId);
                container.innerHTML += `
                    <div class="p-3 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-white px-1.5 py-0.5 rounded" style="background-color: ${c.color}">${c.name}</span>
                            <h4 class="font-bold text-xs text-slate-800 mt-1">${i.title}</h4>
                            <p class="text-[11px] text-slate-600">${i.description}</p>
                            <p class="text-[10px] text-slate-400">Límite: ${i.dueDate}</p>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="openTaskModal('${i.id}')" class="p-1.5 bg-slate-200 text-slate-600 rounded hover:bg-slate-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                            <button onclick="deleteItem('tasks', '${i.id}')" class="p-1.5 bg-red-50 text-red-500 rounded hover:bg-red-100"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function renderMaterials() {
            const container = document.getElementById('materialsList');
            const items = appState.materials;
            container.innerHTML = items.length ? '' : '<p class="text-xs text-slate-400">Sin materiales o códigos en C++.</p>';
            items.forEach(i => {
                const c = getCourse(i.courseId);
                container.innerHTML += `
                    <div class="p-3 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-white px-1.5 py-0.5 rounded" style="background-color: ${c.color}">${c.name}</span>
                            <h5 class="text-xs font-bold text-slate-800 mt-1"><i data-lucide="file-code" class="w-3.5 h-3.5 inline mr-1 text-[#005691]"></i>${i.title}</h5>
                            <a href="${i.url}" target="_blank" class="text-[11px] text-blue-600 underline">${i.url}</a>
                        </div>
                        <button onclick="deleteItem('materials', '${i.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
            });
        }

        function openModal(title, fields, type, editId = null) {
            currentModalType = type;
            currentEditId = editId;
            document.getElementById('modalTitle').innerText = title;
            const container = document.getElementById('modalFields');
            container.innerHTML = '';

            fields.forEach(f => {
                let inputHtml = '';
                if (f.type === 'select') {
                    inputHtml = `<select name="${f.name}" class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none">
                        ${f.options.map(opt => `<option value="${opt.id}" ${f.value === opt.id ? 'selected' : ''}>${opt.name}</option>`).join('')}
                    </select>`;
                } else if (f.type === 'textarea') {
                    inputHtml = `<textarea name="${f.name}" class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs h-16">${f.value || ''}</textarea>`;
                } else {
                    inputHtml = `<input type="${f.type}" name="${f.name}" value="${f.value || ''}" class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs" required>`;
                }
                container.innerHTML += `<div><label class="block text-xs font-semibold text-slate-600 mb-1">${f.label}</label>${inputHtml}</div>`;
            });

            document.getElementById('modalContainer').classList.remove('hidden');
            document.getElementById('modalContainer').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modalContainer').classList.add('hidden');
            document.getElementById('modalContainer').classList.remove('flex');
        }

        function handleModalSubmit(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target).entries());
            data.id = currentEditId || Date.now().toString();

            if (currentModalType === 'course') appState.courses.push(data);
            else if (currentModalType === 'class') appState.classes.push(data);
            else if (currentModalType === 'exam') appState.exams.push(data);
            else if (currentModalType === 'task') {
                if (currentEditId) {
                    const idx = appState.tasks.findIndex(t => t.id === currentEditId);
                    if (idx !== -1) appState.tasks[idx] = data;
                } else appState.tasks.push(data);
            } else if (currentModalType === 'material') appState.materials.push(data);

            saveData();
            closeModal();
        }

        function openCourseModal() {
            openModal('Añadir Curso', [
                { label: 'Nombre del Curso (ej. C++ Avanzado)', name: 'name', type: 'text' },
                { label: 'Color', name: 'color', type: 'color', value: '#005691' }
            ], 'course');
        }

        function openClassModal() {
            openModal('Añadir Clase o Horario', [
                { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
                { label: 'Título / Tema', name: 'title', type: 'text' },
                { label: 'Fecha', name: 'date', type: 'date' },
                { label: 'Hora', name: 'time', type: 'time' }
            ], 'class');
        }

        function openExamModal() {
            openModal('Añadir Examen', [
                { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
                { label: 'Título', name: 'title', type: 'text' },
                { label: 'Tipo', name: 'type', type: 'select', options: [{id:'Parcial', name:'Parcial'}, {id:'Final', name:'Final'}, {id:'Práctica C++', name:'Práctica C++'}] },
                { label: 'Fecha', name: 'date', type: 'date' },
                { label: 'Hora', name: 'time', type: 'time' }
            ], 'exam');
        }

        function openTaskModal(editId = null) {
            const task = editId ? appState.tasks.find(t => t.id === editId) : {};
            openModal(editId ? 'Editar Entregable' : 'Añadir Entregable', [
                { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses, value: task.courseId },
                { label: 'Título del Trabajo', name: 'title', type: 'text', value: task.title },
                { label: 'Descripción / Requisitos C++', name: 'description', type: 'textarea', value: task.description },
                { label: 'Fecha Límite', name: 'dueDate', type: 'date', value: task.dueDate }
            ], 'task', editId);
        }

        function openMaterialModal() {
            openModal('Añadir Material / Código C++', [
                { label: 'Curso', name: 'courseId', type: 'select', options: appState.courses },
                { label: 'Título del Archivo / Script (.cpp)', name: 'title', type: 'text' },
                { label: 'Ruta o Enlace (GitHub / Local)', name: 'url', type: 'text' }
            ], 'material');
        }

        function deleteItem(col, id) {
            appState[col] = appState[col].filter(i => i.id !== id);
            saveData();
        }

        function deleteCourse(id) {
            appState.courses = appState.courses.filter(c => c.id !== id);
            saveData();
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="bg-[#005691] text-white p-2 rounded ml-auto max-w-[80%]">${input.value}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-PE';
            recognition.onresult = (e) => {
                document.getElementById('chatInput').value = e.results[0][0].transcript;
                sendChatMessage();
            };
        }

        function toggleSpeech() {
            if(recognition) recognition.start();
        }

        window.onload = renderAll;
    </script>
</body>
</html>
